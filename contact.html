<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Nova</title>

    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            Nova<span>.</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <button class="nav-btn">
            Get Started
        </button>

    </header>


    <!-- Contact Section -->
    <main>

        <section class="contact">

            <div class="contact-info">

                <p class="small-title">
                    GET IN TOUCH
                </p>

                <h1>
                    Let's talk about
                    <span>your idea.</span>
                </h1>

                <p>
                    Have a question or want to work together?
                    Send us a message and we'll get back to you.
                </p>

                <div class="contact-details">

                    <div>
                        <strong>Email</strong>
                        <p>hello@nova.com</p>
                    </div>

                    <div>
                        <strong>Phone</strong>
                        <p>+1 234 567 890</p>
                    </div>

                    <div>
                        <strong>Location</strong>
                        <p>New York, USA</p>
                    </div>

                </div>

            </div>


            <!-- Contact Form -->
            <div class="contact-form">

                <form>

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >


                    <label for="email">
                        Your Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >


                    <label for="message">
                        Your Message
                    </label>

                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Write your message..."
                    ></textarea>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Send Message →
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Nova. All rights reserved.</p>
    </footer>

</body>
</html>
